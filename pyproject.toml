[project]
name = "hands-on-eda"
version = "0.1.0"
description = "Hands-on EDA e Preprocessamento - Pos-graduacao em Ciencia de Dados"
readme = "README.md"
authors = [
    { name = "Diogo Galrão Carvalho" },
    { name = "Felipe Artur Macedo Lima" },
    { name = "Luan Cavalcante Dias Rodrigues", email = "179644943+luang1t@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel",
    "ipywidgets",
    "markdown-it-py",
    "matplotlib",
    "nbconvert",
    "nbformat",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "weasyprint",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
